name: Notifikasi HP

# Tiap 5 menit pukul 04.00–21.59 WIB (jadwal GitHub memakai UTC; bisa terlambat beberapa menit)
on:
  schedule:
    - cron: "*/5 21-23 * * *"
    - cron: "*/5 0-14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # untuk masuk ke Google tanpa kunci (Workload Identity Federation)

concurrency:
  group: notif
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - id: auth
        name: Masuk ke Google (tanpa kunci)
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/520791575014/locations/global/workloadIdentityPools/github/providers/muawanahku
          service_account: firebase-adminsdk-fbsvc@muawanahku-15687.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - name: Kirim notifikasi yang jatuh tempo
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          TZ: Asia/Jakarta
        run: node tools/notif/kirim.mjs
